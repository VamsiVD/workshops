$kind: http-request
url: '{{base_url}}/notices/{{notice_id}}'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('id matches', () => pm.expect(pm.response.json()._id).to.eql(pm.collectionVariables.get('notice_id')));
    language: text/javascript
order: 3000
