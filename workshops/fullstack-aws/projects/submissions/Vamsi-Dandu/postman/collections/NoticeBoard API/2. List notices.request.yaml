$kind: http-request
url: '{{base_url}}/notices'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('body is an array', () => pm.expect(body).to.be.an('array'));
      pm.test('contains created notice', () => {
        const id = pm.collectionVariables.get('notice_id');
        pm.expect(body.map(n => n._id)).to.include(id);
      });
    language: text/javascript
order: 2000
