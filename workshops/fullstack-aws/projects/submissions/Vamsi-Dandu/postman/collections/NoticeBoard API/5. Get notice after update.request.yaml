$kind: http-request
url: '{{base_url}}/notices/{{notice_id}}'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('title was updated', () => pm.expect(pm.response.json().title).to.eql('Postman test notice (edited)'));
    language: text/javascript
order: 5000
