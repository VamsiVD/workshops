$kind: http-request
url: '{{base_url}}/notices/{{notice_id}}'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
      pm.test('error message', () => pm.expect(pm.response.json().error).to.eql('Notice not found'));
    language: text/javascript
order: 7000
